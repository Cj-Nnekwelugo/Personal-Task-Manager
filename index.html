<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Personal Task Manager</title>

<link rel="stylesheet" href="src/output.css">
<script src="index.js" defer></script>


</head>

<body class="min-h-screen bg-gray-100 p-4 text-gray-800">


<main class="mx-auto max-w-3xl">

    <header class="mb-8">
        <h1 class="mb-2 text-3xl font-bold">
            Welcome to Your Personal Task Manager
        </h1>

        <p class="text-gray-600">
            Manage your tasks efficiently and stay organized.
        </p>

        <nav class="mt-4">
            <ul class="flex flex-wrap gap-4">
                <li><a href="#add-task" class="text-blue-600 underline">Add New Task</a></li>
                <li><a href="#view-tasks" class="text-blue-600 underline">View Tasks</a></li>
            </ul>
        </nav>
    </header>

    <section id="add-task" class="mb-8 rounded-lg bg-white p-6 shadow">

        <h2 class="mb-4 text-xl font-bold">Add a Task</h2>

        <form id="task-form">

            <div class="mb-4">
                <label for="task-title" class="mb-1 block font-medium">
                    Task Title:
                </label>

                <input
                    class="w-full rounded border border-gray-300 p-2"
                    type="text"
                    id="task-title"
                    name="title"
                    placeholder="Enter the task name"
                    required
                    maxlength="100"
                >
            </div>

            <div class="mb-4">
                <label for="task-description" class="mb-1 block font-medium">
                    Description:
                </label>

                <textarea
                    class="w-full rounded border border-gray-300 p-2"
                    id="task-description"
                    name="description"
                    placeholder="Enter the task description"
                    required
                    rows="4"
                    maxlength="1000"
                ></textarea>
            </div>

            <div class="mb-4">
                <label for="task-priority" class="mb-1 block font-medium">
                    Priority:
                </label>

                <select
                    class="w-full rounded border border-gray-300 p-2"
                    id="task-priority"
                    name="priority"
                    required
                >
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="date" class="mb-1 block font-medium">
                    Due Date:
                </label>

                <input
                    type="date"
                    id="date"
                    name="due_date"
                    class="w-full rounded border border-gray-300 p-2"
                    required
                >
            </div>

            <button
                id="add-task-btn"
                type="submit"
                class="rounded bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700 hover:cursor-pointer"
            >
                Add Task
            </button>

            <button
                id="cancel-edit-btn"
                type="button"
                class="ml-2 hidden rounded bg-gray-500 px-4 py-2 text-white hover:bg-gray-600 hover:cursor-pointer"
            >
                Cancel Edit
            </button>

        </form>

        <p id="form-status" class="mt-3" role="status" aria-live="polite"></p>

    </section>

    <section id="view-tasks" class="rounded-lg bg-white p-6 shadow">

        <h2 class="mb-4 text-xl font-bold">Your Tasks</h2>

        <div class="mb-4">
            <label for="task-filter" class="mb-1 block font-medium">
                Filter Tasks:
            </label>

            <select
                id="task-filter"
                class="rounded border border-gray-300 p-2 hover:cursor-pointer"
            >
                <option value="all">All Tasks</option>
                <option value="pending">Pending Tasks</option>
                <option value="completed">Completed Tasks</option>
            </select>
        </div>

        <p id="task-count" class="mb-4 text-gray-600"></p>

        <p id="empty-message" class="text-gray-500">
            You haven't added any tasks yet.
        </p>

        <div id="task-list" class="space-y-4">
            <!-- JavaScript will display tasks here. -->
        </div>

    </section>

</main>


</body>
</html>
