<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Task Manager</title>
</head>
<body class="bg-gray-100" >
    <h1 >Welcome to Your Personal Task Manager</h1>
    <p>Manage your tasks efficiently and stay organized.</p>
    <ul class="list-disc pl-5 ">
        
        <li><a href="add-task.html">Add New Task</a></li>
        <li><a href="tasks.html">View Tasks</a></li>
        <li><a href="settings.html">Settings</a></li>
    </ul>
    

    <section id="add-task.html">

        <form action="add-task.html" method="POST">

            <label for="task-title">Task Title:</label>
            <input type="text"
             id="task-title" 
             placeholder="Enter the task name"
             name="title" required>

            <label for="task-description">Description:</label>
            <textarea 
            id="task-description"
             name="description"
              placeholder="Enter the task description"
              >
            </textarea>

            <label for="task-title">Priority:</label>
            <select 
            id="task-title"
             name="priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>

            <label for="date">Due date</label>
            <input type="date" 
            id="date"
             name="due_date">

            <button type="submit">Add Task</button>
        </form>

    </section>

    <section id="task.html">
        <h2>View Tasks</h2>
        <span id="task-list">
            <!-- Task list will be dynamically populated here -->
            <button>Complete</button>
             <button>Edit</button>
             <button>Delete</button>


        </span>

    </section>
</body>
</html>
